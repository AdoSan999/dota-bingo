<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Compendium Bingo (5x5)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f1115;
      color: #e1e1e1;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
    }
    h1 {
      color: #e5c158;
      text-shadow: 0 0 12px rgba(229,193,88,0.4);
      margin-bottom: 5px;
      text-align: center;
    }
    .room-bar {
      background: #181b22;
      border: 1px solid #323846;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    input[type="text"] {
      background: #0f1115;
      border: 1px solid #e5c158;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
    }
    button.btn-main {
      background: linear-gradient(135deg, #a32c2c, #631212);
      color: #fff;
      border: 1px solid #e5c158;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    button.btn-main:hover { background: linear-gradient(135deg, #c43737, #801818); }
    
    .status-text { font-size: 13px; color: #52c41a; font-weight: bold; }
    
    .player-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      background: #181b22;
      padding: 8px 15px;
      border-radius: 8px;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-btn.selected {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transform: scale(1.2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 700px;
    }
    .cell {
      background: #1a1d24;
      border: 1px solid #323846;
      border-radius: 6px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      word-break: break-word;
      position: relative;
    }
    .cell:hover { border-color: #e5c158; }

    /* Цвета игроков */
    .cell.p-blue   { background: #1b4f72 !important; border-color: #3498db; color: #fff; font-weight: bold; }
    .cell.p-teal   { background: #117a65 !important; border-color: #1abc9c; color: #fff; font-weight: bold; }
    .cell.p-purple { background: #6c3483 !important; border-color: #a569bd; color: #fff; font-weight: bold; }
    .cell.p-yellow { background: #b7950b !important; border-color: #f1c40f; color: #fff; font-weight: bold; }
    .cell.p-orange { background: #af601a !important; border-color: #e67e22; color: #fff; font-weight: bold; }

    @media (max-width: 600px) {
      .cell { font-size: 9px; padding: 2px; }
    }
  </style>
</head>
<body>

  <h1>DOTA 2 COMPENDIUM BINGO</h1>

  <!-- Мультиплеер панель -->
  <div class="room-bar">
    <button class="btn-main" onclick="createRoom()">👑 Создать комнату</button>
    <span>или</span>
    <input type="text" id="join-id" placeholder="Код комнаты...">
    <button class="btn-main" style="background:#2b5937; border-color:#52c41a;" onclick="joinRoom()">🔗 Войти</button>
    <div class="status-text" id="status">Статус: Одиночный режим</div>
  </div>

  <div class="player-selector">
    <label style="font-size:13px; color:#aaa; margin-right:10px;">Твой цвет:</label>
    <div class="color-btn selected" style="background:#3498db;" onclick="selectColor('p-blue', this)" title="Игрок 1"></div>
    <div class="color-btn" style="background:#1abc9c;" onclick="selectColor('p-teal', this)" title="Игрок 2"></div>
    <div class="color-btn" style="background:#a569bd;" onclick="selectColor('p-purple', this)" title="Игрок 3"></div>
    <div class="color-btn" style="background:#f1c40f;" onclick="selectColor('p-yellow', this)" title="Игрок 4"></div>
    <div class="color-btn" style="background:#e67e22;" onclick="selectColor('p-orange', this)" title="Игрок 5"></div>
    <button class="btn-main" style="margin-left:auto; background:#333; border-color:#555;" onclick="newBoard()">🔄 Новая доска</button>
  </div>

  <div class="grid" id="board"></div>
