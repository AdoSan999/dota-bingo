<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Bingo 5x5 - с палитрой для 5 игроков</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f1115;
      color: #e1e1e1;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
    }
    h1 {
      color: #e5c158;
      text-shadow: 0 0 12px rgba(229,193,88,0.4);
      margin-bottom: 10px;
      text-align: center;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      background: #181b22;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid #2a2e39;
    }
    button.btn-main {
      background: linear-gradient(135deg, #a32c2c, #631212);
      color: #fff;
      border: 1px solid #e5c158;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    button.btn-main:hover { background: linear-gradient(135deg, #c43737, #801818); }
    
    .player-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .player-selector label { font-size: 14px; font-weight: bold; color: #aaa; }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.selected {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transform: scale(1.2);
    }

    .main-container {
      display: flex;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 700px;
    }
    .cell {
      background: #1a1d24;
      border: 1px solid #323846;
      border-radius: 6px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, transform 0.1s;
      word-break: break-word;
    }
    .cell:hover { border-color: #e5c158; }

    /* Цвета закрашивания */
    .cell.p-blue   { background: #1b4f72 !important; border-color: #3498db; font-weight: bold; color: #fff; }
    .cell.p-teal   { background: #117a65 !important; border-color: #1abc9c; font-weight: bold; color: #fff; }
    .cell.p-purple { background: #6c3483 !important; border-color: #a569bd; font-weight: bold; color: #fff; }
    .cell.p-yellow { background: #b7950b !important; border-color: #f1c40f; font-weight: bold; color: #fff; }
    .cell.p-orange { background: #af601a !important; border-color: #e67e22; font-weight: bold; color: #fff; }
